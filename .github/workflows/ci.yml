name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate skills and marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Use the same requirements file scripts/check.sh uses locally,
        # so local-green and CI-green stay in lockstep.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate marketplace + skills
        run: python scripts/validate.py

      - name: Run unit tests on the validator
        run: pytest -q tests/

  version-bump:
    name: Plugin version bumped when skills change
    # Only meaningful on a PR: the check compares the branch against its base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for the base branch, not just the merge commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A plugin that declares a version is pinned to it; installed copies
      # only update when the string changes. This fails the PR if anything
      # under skills/ changed without a bump in marketplace.json.
      - name: Check plugin version bump
        run: python scripts/check_version_bump.py origin/${{ github.base_ref }}

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # markdownlint-cli2 is fast and easy to silence per-rule via the config
      # in .markdownlint.jsonc. The intent of this job is to catch broken
      # links and obviously busted formatting — not to enforce stylistic taste.
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules
